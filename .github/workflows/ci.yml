name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (bash -n)
        run: bash -n mcli install.sh install-regen.sh

      - name: ShellCheck
        run: shellcheck --severity=error mcli install.sh install-regen.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run smoke tests
        run: bats test/smoke.bats
