name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (bash -n)
        run: bash -n mcli install.sh install-regen.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          files: mcli install.sh install-regen.sh
